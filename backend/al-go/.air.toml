root = "."
tmp_dir = "tmp"

[build]
cmd = "lsof -ti tcp:9090 | xargs kill -9; make run"
include = ["*.go"]
exclude = []
exclude_file = ["src/web/wire_gen.go"]

[misc]
clean_on_exit = true

[log]
# Show log time
time = false
# Only show main log (silences watcher, build, runner)
main_only = false
# silence all logs produced by air 
silent = false

[color]
main = "yellow"
watcher = "cyan"
build = "green"
log = "white"
