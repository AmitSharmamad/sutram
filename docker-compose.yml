services:
  web-app:
    build:
      context: ./
      dockerfile: Dockerfile.web
    env_file:
      - ./.env
    container_name: sutram-web
    ports:
      - 8080:8080
    networks:
      - sutram-network
    depends_on:
      postgres:
        condition: service_healthy  # <-- Waits for Postgres to be ready
      clickhouse:
        condition: service_healthy  # <-- Waits for ClickHouse to be ready

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: sutramdb
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=admin
    ports:
      - 8123:8123
      - 9000:9000
    volumes:
      - ./db/db/ch/data:/var/lib/clickhouse/
      - ./db/db/ch/logs:/var/log/clickhouse-server/
      - ./db/sql/clickhouse:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    networks:
      - sutram-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      
  postgres:
    image: postgres:latest
    container_name: sutrampgdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=sutram
    ports:
      - 9009:5432
    volumes:
      - ./db/sql/postgres:/docker-entrypoint-initdb.d/
      - ./db/db/pg/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sutram-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sutram"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  sutram-network:
    name: sutram-network
    driver: bridge
