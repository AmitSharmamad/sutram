services:
  al-go:
    build:
      context: ./backend/al-go
      dockerfile: Dockerfile
    container_name: sutram-al-go
    ports:
      - 9999:9999
    networks:
      - sutram-network
    depends_on:
      - sutramdb

  sutramdb:
    image: clickhouse/clickhouse-server
    container_name: sutramdb
    environment:
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=admin
    ports:
      - 8123:8123
      - 9000:9000
    volumes:
      - ./db/mount/data:/var/lib/clickhouse/
      - ./db/mount/logs:/var/log/clickhouse-server/
      - ./db/sql:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    networks:
      - sutram-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  sutram-network:
    driver: bridge
