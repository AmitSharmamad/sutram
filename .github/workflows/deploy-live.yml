name: Deploy Live Trading Service

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cmd/live/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-live

jobs:
  build-live:
    name: Build Live Trading Service
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Dockerfile for Live Service
        run: |
          cat > Dockerfile.live << 'EOF'
          FROM golang:1.23-alpine AS builder

          WORKDIR /app

          # Copy go.mod and go.sum
          COPY go.mod go.sum ./
          RUN go mod download

          # Copy the source code
          COPY . .

          # Build the live trading service
          RUN CGO_ENABLED=0 GOOS=linux go build -gcflags="all=-N -l" -o live-server ./cmd/live/

          # Use a small alpine image for the final container
          FROM alpine:latest

          WORKDIR /app

          # Install necessary packages
          RUN apk --no-cache add ca-certificates tzdata

          # Copy the binary from the builder stage
          COPY --from=builder /app/live-server .

          # Copy the .env file
          COPY .env .

          # Expose the application port
          EXPOSE 8081

          # Run the live server
          CMD ["./live-server"]
          EOF

      - name: Build and push Live Trading Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.live
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-live-dev:
    name: Deploy Live Service to Development
    runs-on: ubuntu-latest
    needs: build-live
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy Live Trading Service to AWS ECS
        run: |
          # Update the task definition with new image
          aws ecs describe-task-definition \
            --task-definition sutram-dev-live-trading \
            --query taskDefinition > task-definition.json
          
          # Update image URI in task definition
          jq --arg IMAGE_URI "${{ needs.build-live.outputs.image-tag }}" \
            '.containerDefinitions[0].image = $IMAGE_URI' \
            task-definition.json > updated-task-definition.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json
          
          # Update service
          aws ecs update-service \
            --cluster sutram-dev-cluster \
            --service sutram-dev-live-trading \
            --task-definition sutram-dev-live-trading
          
          # Wait for deployment to complete
          aws ecs wait services-stable \
            --cluster sutram-dev-cluster \
            --services sutram-dev-live-trading



  deploy-live-prod:
    name: Deploy Live Service to Production
    runs-on: ubuntu-latest
    needs: build-live
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy Live Trading Service to AWS ECS
        run: |
          # Update the task definition with new image
          aws ecs describe-task-definition \
            --task-definition sutram-prod-live-trading \
            --query taskDefinition > task-definition.json
          
          # Update image URI in task definition
          jq --arg IMAGE_URI "${{ needs.build-live.outputs.image-tag }}" \
            '.containerDefinitions[0].image = $IMAGE_URI' \
            task-definition.json > updated-task-definition.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json
          
          # Update service
          aws ecs update-service \
            --cluster sutram-prod-cluster \
            --service sutram-prod-live-trading \
            --task-definition sutram-prod-live-trading
          
          # Wait for deployment to complete
          aws ecs wait services-stable \
            --cluster sutram-prod-cluster \
            --services sutram-prod-live-trading

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-live-dev, deploy-live-prod]
    if: always() && (needs.deploy-live-dev.result == 'success' || needs.deploy-live-prod.result == 'success')
    steps:
      - name: Wait for service to be ready
        run: sleep 30

      - name: Health check
        run: |
          # Determine environment based on which deployment succeeded
          if [ "${{ needs.deploy-live-dev.result }}" == "success" ]; then
            ENVIRONMENT="dev"
          else
            ENVIRONMENT="prod"
          fi
          
          echo "Performing health check for $ENVIRONMENT environment"
          
          # Get the load balancer URL from AWS
          aws ecs describe-services \
            --cluster sutram-${ENVIRONMENT}-cluster \
            --services sutram-${ENVIRONMENT}-live-trading \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text
          
          # Add specific health check logic here
          echo "Live trading service deployment completed successfully"
