name: Deploy Infrastructure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'aws/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
          - validate

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate CloudFormation templates
        run: |
          cd aws
          make validate-all ENV=dev

  deploy-dev:
    name: Deploy Infrastructure to Development
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.action == 'deploy')
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set AWS Account ID
        run: |
          cd aws
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s/AWS_ACCOUNT_ID=.*/AWS_ACCOUNT_ID=$ACCOUNT_ID/" config/dev.env

      - name: Deploy infrastructure
        run: |
          cd aws
          make deploy-all ENV=dev

      - name: Output deployment status
        run: |
          cd aws
          make status ENV=dev



  deploy-prod:
    name: Deploy Infrastructure to Production
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'deploy')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set AWS Account ID
        run: |
          cd aws
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s/AWS_ACCOUNT_ID=.*/AWS_ACCOUNT_ID=$ACCOUNT_ID/" config/prod.env

      - name: Deploy infrastructure
        run: |
          cd aws
          make deploy-all ENV=prod

      - name: Output deployment status
        run: |
          cd aws
          make status ENV=prod

  destroy-dev:
    name: Destroy Development Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.action == 'destroy'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Destroy infrastructure
        run: |
          cd aws
          make delete-all ENV=dev



  destroy-prod:
    name: Destroy Production Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'destroy'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Destroy infrastructure
        run: |
          cd aws
          make delete-all ENV=prod

  cost-monitoring:
    name: Monitor Costs
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Generate cost report
        run: |
          cd aws
          if [ "${{ needs.deploy-dev.result }}" == "success" ]; then
            make show-costs ENV=dev
          fi
          if [ "${{ needs.deploy-prod.result }}" == "success" ]; then
            make show-costs ENV=prod
          fi

  notify:
    name: Notify Infrastructure Status
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod, destroy-dev, destroy-prod]
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.deploy-dev.result == 'success' || 
          needs.deploy-prod.result == 'success' ||
          needs.destroy-dev.result == 'success' || 
          needs.destroy-prod.result == 'success'
        run: |
          echo "Infrastructure operation completed successfully!"
          # Add notification logic here (Slack, Discord, etc.)

      - name: Notify on failure
        if: |
          needs.deploy-dev.result == 'failure' || 
          needs.deploy-prod.result == 'failure' ||
          needs.destroy-dev.result == 'failure' || 
          needs.destroy-prod.result == 'failure'
        run: |
          echo "Infrastructure operation failed!"
          # Add notification logic here (Slack, Discord, etc.)
          exit 1
