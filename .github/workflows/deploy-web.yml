name: Deploy Web Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-web-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go Dependencies
        run: go mod download

      - name: Install Wire
        run: go install github.com/google/wire/cmd/wire@latest

      - name: Generate Wire Code and Build Binaries
        run: |
          wire cmd/web/wire.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/web cmd/web/wire_gen.go cmd/web/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/db-migrate cmd/db-migrate/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/ch-migrate cmd/ch-migrate/main.go

      - name: Run PostgreSQL Migrations
        run: |
          echo "Running PostgreSQL migrations before deployment..."
          
          # Get database connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="dev"
          
          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseUsername'].OutputValue" \
            --output text)
          
          DB_PASSWORD=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePassword'].OutputValue" \
            --output text)
          
          DB_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)
          
          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue" \
            --output text)
          
          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseName'].OutputValue" \
            --output text)
          
          # Construct DATABASE_URL
          export DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?sslmode=require"
          
          # Run migrations
          ./bin/db-migrate -action=up
          
          echo "PostgreSQL migrations completed successfully"

      - name: Run ClickHouse Migrations
        run: |
          echo "Running ClickHouse migrations before deployment..."
          
          # Get ClickHouse connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="dev"
          
          CH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-clickhouse" \
            --query "Stacks[0].Outputs[?OutputKey=='ClickHouseEndpoint'].OutputValue" \
            --output text)
          
          # Construct CH_URL (using the same format as the service)
          export CH_URL="clickhouse://sutram_user:REDACTED_PASSWORD@${CH_ENDPOINT}:9000/sutram"
          
          # Run migrations
          ./bin/ch-migrate -action=up
          
          echo "ClickHouse migrations completed successfully"

      - name: Build and Push Web Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sutram-dev-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -f docker/web/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and Deploy Web Service to Dev
        run: |
          chmod +x aws/scripts/deploy-web.sh
          aws/scripts/deploy-web.sh dev ${{ github.sha }}

  deploy-web-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go Dependencies
        run: go mod download

      - name: Install Wire
        run: go install github.com/google/wire/cmd/wire@latest

      - name: Generate Wire Code and Build Binaries
        run: |
          wire cmd/web/wire.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/web cmd/web/wire_gen.go cmd/web/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/db-migrate cmd/db-migrate/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bin/ch-migrate cmd/ch-migrate/main.go

      - name: Run PostgreSQL Migrations
        run: |
          echo "Running PostgreSQL migrations before deployment..."
          
          # Get database connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="prod"
          
          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseUsername'].OutputValue" \
            --output text)
          
          DB_PASSWORD=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePassword'].OutputValue" \
            --output text)
          
          DB_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)
          
          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue" \
            --output text)
          
          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-postgres" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseName'].OutputValue" \
            --output text)
          
          # Construct DATABASE_URL
          export DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?sslmode=require"
          
          # Run migrations
          ./bin/db-migrate -action=up
          
          echo "PostgreSQL migrations completed successfully"

      - name: Run ClickHouse Migrations
        run: |
          echo "Running ClickHouse migrations before deployment..."
          
          # Get ClickHouse connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="prod"
          
          CH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-clickhouse" \
            --query "Stacks[0].Outputs[?OutputKey=='ClickHouseEndpoint'].OutputValue" \
            --output text)
          
          # Construct CH_URL (using the same format as the service)
          export CH_URL="clickhouse://sutram_user:REDACTED_PASSWORD@${CH_ENDPOINT}:9000/sutram"
          
          # Run migrations
          ./bin/ch-migrate -action=up
          
          echo "ClickHouse migrations completed successfully"

      - name: Build and Push Web Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sutram-prod-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -f docker/web/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and Deploy Web Service to Prod
        run: |
          chmod +x aws/scripts/deploy-web.sh
          aws/scripts/deploy-web.sh prod ${{ github.sha }}
