name: PR Test and Coverage

on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check test coverage for changed files
        run: |
          # Get the list of files changed in this PR
          git fetch origin main
          CHANGED_GO_FILES=$(git diff --name-only origin/main..HEAD | grep '\.go$' | grep -v '_test.go$' || echo "")
          
          if [ -z "$CHANGED_GO_FILES" ]; then
            echo "No Go files changed in this PR."
            exit 0
          fi
          
          echo "Changed Go files:"
          echo "$CHANGED_GO_FILES"
          
          # Display overall coverage
          go tool cover -func=coverage.out
          
          # Check coverage for each changed file
          EXIT_CODE=0
          for FILE in $CHANGED_GO_FILES; do
            if [ -f "$FILE" ]; then
              FILE_COVERAGE=$(go tool cover -func=coverage.out | grep "${FILE}:" || echo "${FILE}: 0.0%")
              echo "Checking coverage for: $FILE_COVERAGE"
              
              # Extract coverage percentage
              COVERAGE_PCT=$(echo "$FILE_COVERAGE" | grep -o '[0-9]\+\.[0-9]\+%' | sed 's/%//' || echo "0.0")
              
              # If coverage is less than 100%, mark for failure
              COVERAGE_NUM=$(echo $COVERAGE_PCT | cut -d. -f1)
              if [ "$COVERAGE_NUM" -lt 100 ]; then
                echo "::warning::$FILE has less than 100% test coverage: $COVERAGE_PCT%"
                EXIT_CODE=1
              fi
            fi
          done
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Some changed files have less than 100% test coverage."
          else
            echo "All changed files have 100% test coverage."
          fi
          
          exit $EXIT_CODE