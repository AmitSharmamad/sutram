name: Run ClickHouse Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations on'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Migration action to perform'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - version
          - validate
      steps:
        description: 'Number of steps (only for steps action)'
        required: false
        default: '1'
        type: string

jobs:
  migrate-ch-dev:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Load environment variables and setup CH_URL
        run: |
          echo "Loading dev environment variables..."
          
          # Load common script functions
          source aws/scripts/common.sh
          
          # Get ClickHouse connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="dev"
          
          CH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-clickhouse" \
            --query "Stacks[0].Outputs[?OutputKey=='ClickHouseServiceEndpoint'].OutputValue" \
            --output text)
          
          # Construct CH_URL (using the same credentials as in CloudFormation templates)
          export CH_URL="clickhouse://sutram_user:change_me_clickhouse@${CH_ENDPOINT}:9000/sutram"
          echo "CH_URL=${CH_URL}" >> $GITHUB_ENV
          
          echo "ClickHouse connection configured successfully"

      - name: Build ClickHouse migration binary
        run: |
          echo "Building ClickHouse migration binary..."
          go build -o bin/ch-migrate cmd/ch-migrate/main.go

      - name: Run ClickHouse migration - up
        if: github.event.inputs.action == 'up'
        run: |
          echo "Running all pending ClickHouse migrations..."
          ./bin/ch-migrate -action=up

      - name: Run ClickHouse migration - down
        if: github.event.inputs.action == 'down'
        run: |
          echo "Rolling back ClickHouse migrations..."
          ./bin/ch-migrate -action=down

      - name: Run ClickHouse migration - version
        if: github.event.inputs.action == 'version'
        run: |
          echo "Checking current ClickHouse migration version..."
          ./bin/ch-migrate -action=version

      - name: Run ClickHouse migration - validate
        if: github.event.inputs.action == 'validate'
        run: |
          echo "Validating ClickHouse migrations..."
          ./bin/ch-migrate -action=validate

      - name: Run ClickHouse migration - steps
        if: github.event.inputs.action == 'steps'
        run: |
          echo "Running ClickHouse migration steps..."
          ./bin/ch-migrate -action=steps -steps=${{ github.event.inputs.steps }}

  migrate-ch-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Load environment variables and setup CH_URL
        run: |
          echo "Loading prod environment variables..."
          
          # Load common script functions
          source aws/scripts/common.sh
          
          # Get ClickHouse connection details from CloudFormation
          PROJECT_NAME="sutram"
          ENVIRONMENT="prod"
          
          CH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-${ENVIRONMENT}-clickhouse" \
            --query "Stacks[0].Outputs[?OutputKey=='ClickHouseServiceEndpoint'].OutputValue" \
            --output text)
          
          # Construct CH_URL (using the same credentials as in CloudFormation templates)
          export CH_URL="clickhouse://sutram_user:change_me_clickhouse@${CH_ENDPOINT}:9000/sutram"
          echo "CH_URL=${CH_URL}" >> $GITHUB_ENV
          
          echo "ClickHouse connection configured successfully"

      - name: Build ClickHouse migration binary
        run: |
          echo "Building ClickHouse migration binary..."
          go build -o bin/ch-migrate cmd/ch-migrate/main.go

      - name: Run ClickHouse migration - up
        if: github.event.inputs.action == 'up'
        run: |
          echo "Running all pending ClickHouse migrations..."
          ./bin/ch-migrate -action=up

      - name: Run ClickHouse migration - down
        if: github.event.inputs.action == 'down'
        run: |
          echo "Rolling back ClickHouse migrations..."
          ./bin/ch-migrate -action=down

      - name: Run ClickHouse migration - version
        if: github.event.inputs.action == 'version'
        run: |
          echo "Checking current ClickHouse migration version..."
          ./bin/ch-migrate -action=version

      - name: Run ClickHouse migration - validate
        if: github.event.inputs.action == 'validate'
        run: |
          echo "Validating ClickHouse migrations..."
          ./bin/ch-migrate -action=validate

      - name: Run ClickHouse migration - steps
        if: github.event.inputs.action == 'steps'
        run: |
          echo "Running ClickHouse migration steps..."
          ./bin/ch-migrate -action=steps -steps=${{ github.event.inputs.steps }}
