name: Deploy Infrastructure

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'aws/templates/infra.yaml'
      - 'aws/config/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-infra-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Infrastructure to Dev
        run: |
          aws cloudformation deploy \
            --template-file aws/templates/infra.yaml \
            --stack-name sutram-infra-dev \
            --parameter-overrides \
              Environment=dev \
              ProjectName=sutram \
              UseSingleNATGateway=true \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ap-south-1

      - name: Verify Deployment
        run: |
          aws cloudformation describe-stacks \
            --stack-name sutram-infra-dev \
            --region ap-south-1 \
            --query 'Stacks[0].StackStatus' \
            --output text

  deploy-infra-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Infrastructure to Prod
        run: |
          aws cloudformation deploy \
            --template-file aws/templates/infra.yaml \
            --stack-name sutram-infra-prod \
            --parameter-overrides \
              Environment=prod \
              ProjectName=sutram \
              UseSingleNATGateway=false \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ap-south-1

      - name: Verify Deployment
        run: |
          aws cloudformation describe-stacks \
            --stack-name sutram-infra-prod \
            --region ap-south-1 \
            --query 'Stacks[0].StackStatus' \
            --output text
