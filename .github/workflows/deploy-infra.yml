name: Deploy Infrastructure

# on:
#   push:
#     branches:
#       - dev
#       - main
#     paths:
#       - 'aws/templates/infra.yaml'
#       - 'aws/config/**'
#       - '.github/workflows/deploy-infra.yml'
#   workflow_dispatch:
#     inputs:
#       environment:
#         description: 'Environment to deploy to'
#         required: true
#         default: 'dev'
#         type: choice
#         options:
#           - dev
#           - prod

jobs:
  deploy-infra-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: false

      - name: Deploy Infrastructure to Dev
        run: |
          chmod +x aws/scripts/deploy-infra.sh
          aws/scripts/deploy-infra.sh dev

  deploy-infra-prod:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          mask-aws-account-id: false

      - name: Deploy Infrastructure to Prod
        run: |
          chmod +x aws/scripts/deploy-infra.sh
          aws/scripts/deploy-infra.sh prod
