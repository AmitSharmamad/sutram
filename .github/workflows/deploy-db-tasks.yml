name: Database and Deployment Tasks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'db/**'
      - 'cmd/migrate/**'
      - 'cmd/deployment/**'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate
          - deployment
          - backup
          - restore
      environment:
        description: 'Environment to run against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io

jobs:
  build-migration-tools:
    name: Build Migration Tools
    runs-on: ubuntu-latest
    outputs:
      migrate-image: ${{ steps.migrate-meta.outputs.tags }}
      deployment-image: ${{ steps.deployment-meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for migrate
        id: migrate-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-migrate
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for deployment
        id: deployment-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-deployment
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create Dockerfile for Migration
        run: |
          cat > Dockerfile.migrate << 'EOF'
          FROM golang:1.23-alpine AS builder

          WORKDIR /app

          # Copy go.mod and go.sum
          COPY go.mod go.sum ./
          RUN go mod download

          # Copy the source code
          COPY . .

          # Build the migration tool
          RUN CGO_ENABLED=0 GOOS=linux go build -o migrate-tool ./cmd/migrate/

          # Use a small alpine image for the final container
          FROM alpine:latest

          WORKDIR /app

          # Install necessary packages
          RUN apk --no-cache add ca-certificates tzdata postgresql-client

          # Copy the binary from the builder stage
          COPY --from=builder /app/migrate-tool .

          # Copy data files
          COPY data/ ./data/
          COPY db/ ./db/

          # Copy the .env file
          COPY .env .

          # Run the migration tool
          CMD ["./migrate-tool"]
          EOF

      - name: Create Dockerfile for Deployment
        run: |
          cat > Dockerfile.deployment << 'EOF'
          FROM golang:1.23-alpine AS builder

          WORKDIR /app

          # Copy go.mod and go.sum
          COPY go.mod go.sum ./
          RUN go mod download

          # Copy the source code
          COPY . .

          # Build the deployment tool
          RUN CGO_ENABLED=0 GOOS=linux go build -gcflags="all=-N -l" -o deployment-tool ./cmd/deployment/

          # Use a small alpine image for the final container
          FROM alpine:latest

          WORKDIR /app

          # Install necessary packages
          RUN apk --no-cache add ca-certificates tzdata curl

          # Copy the binary from the builder stage
          COPY --from=builder /app/deployment-tool .

          # Copy the .env file
          COPY .env .

          # Run the deployment tool
          CMD ["./deployment-tool"]
          EOF

      - name: Build and push Migration Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.migrate
          push: true
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Deployment Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.deployment
          push: true
          tags: ${{ steps.deployment-meta.outputs.tags }}
          labels: ${{ steps.deployment-meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migrations-dev:
    name: Run Migrations (Development)
    runs-on: ubuntu-latest
    needs: build-migration-tools
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.task == 'migrate')
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run migration task
        run: |
          # Run as ECS task
          aws ecs run-task \
            --cluster sutram-dev-cluster \
            --task-definition sutram-dev-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "migrate",
                  "image": "${{ needs.build-migration-tools.outputs.migrate-image }}"
                }
              ]
            }' \
            --wait

  run-migrations-staging:
    name: Run Migrations (Staging)
    runs-on: ubuntu-latest
    needs: build-migration-tools
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.task == 'migrate')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run migration task
        run: |
          # Run as ECS task
          aws ecs run-task \
            --cluster sutram-staging-cluster \
            --task-definition sutram-staging-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "migrate",
                  "image": "${{ needs.build-migration-tools.outputs.migrate-image }}"
                }
              ]
            }' \
            --wait

  run-migrations-prod:
    name: Run Migrations (Production)
    runs-on: ubuntu-latest
    needs: [build-migration-tools, run-migrations-staging]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.task == 'migrate')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run migration task
        run: |
          # Run as ECS task
          aws ecs run-task \
            --cluster sutram-prod-cluster \
            --task-definition sutram-prod-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx],assignPublicIp=ENABLED}" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "migrate",
                  "image": "${{ needs.build-migration-tools.outputs.migrate-image }}"
                }
              ]
            }' \
            --wait

  run-deployment-task:
    name: Run Deployment Task
    runs-on: ubuntu-latest
    needs: build-migration-tools
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'deployment'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run deployment task
        run: |
          ENV=${{ github.event.inputs.environment }}
          # Run as ECS task
          aws ecs run-task \
            --cluster sutram-${ENV}-cluster \
            --task-definition sutram-${ENV}-deployment \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx],assignPublicIp=ENABLED}" \
            --overrides "{
              \"containerOverrides\": [
                {
                  \"name\": \"deployment\",
                  \"image\": \"${{ needs.build-migration-tools.outputs.deployment-image }}\"
                }
              ]
            }" \
            --wait

  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'backup'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Create RDS snapshot
        run: |
          ENV=${{ github.event.inputs.environment }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Create RDS snapshot
          aws rds create-db-snapshot \
            --db-instance-identifier sutram-${ENV}-postgres \
            --db-snapshot-identifier sutram-${ENV}-backup-${TIMESTAMP}
          
          # Wait for snapshot to complete
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier sutram-${ENV}-backup-${TIMESTAMP}
          
          echo "Database backup completed: sutram-${ENV}-backup-${TIMESTAMP}"

  restore-database:
    name: Restore Database
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'restore'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: List available snapshots
        run: |
          ENV=${{ github.event.inputs.environment }}
          echo "Available snapshots:"
          aws rds describe-db-snapshots \
            --db-instance-identifier sutram-${ENV}-postgres \
            --query 'DBSnapshots[*].[DBSnapshotIdentifier,SnapshotCreateTime]' \
            --output table
          
          echo "To restore, you need to manually specify the snapshot ID"
          echo "This step requires manual intervention for safety"

  notify-status:
    name: Notify Task Status
    runs-on: ubuntu-latest
    needs: [run-migrations-dev, run-migrations-staging, run-migrations-prod, run-deployment-task, backup-database, restore-database]
    if: always()
    steps:
      - name: Notify on success
        if: |
          needs.run-migrations-dev.result == 'success' || 
          needs.run-migrations-staging.result == 'success' || 
          needs.run-migrations-prod.result == 'success' ||
          needs.run-deployment-task.result == 'success' ||
          needs.backup-database.result == 'success' ||
          needs.restore-database.result == 'success'
        run: |
          echo "Database/Deployment task completed successfully!"
          # Add notification logic here

      - name: Notify on failure
        if: |
          needs.run-migrations-dev.result == 'failure' || 
          needs.run-migrations-staging.result == 'failure' || 
          needs.run-migrations-prod.result == 'failure' ||
          needs.run-deployment-task.result == 'failure' ||
          needs.backup-database.result == 'failure' ||
          needs.restore-database.result == 'failure'
        run: |
          echo "Database/Deployment task failed!"
          # Add notification logic here
          exit 1
