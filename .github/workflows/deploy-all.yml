name: Deploy All Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  deploy-all-dev:
    if: github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Install Wire
        run: go install github.com/google/wire/cmd/wire@latest

      - name: Deploy All Services to Dev
        run: |
          echo "Deploying all services in correct order..."
          
          # Make scripts executable
          chmod +x aws/scripts/*.sh
          
          # Deploy Infrastructure
          aws/scripts/infra.sh dev
          
          # Deploy PostgreSQL
          aws/scripts/pg.sh dev
          
          # Deploy ClickHouse
          aws/scripts/ch.sh dev
          
          # Deploy Web Service
          aws/scripts/web.sh dev
          
          # Deploy Live Service
          aws/scripts/live.sh dev
          
          # Deploy Deployment Service
          aws/scripts/deployment.sh dev

      - name: Verify All Deployments
        run: |
          echo "Verifying deployment status..."
          for stack in sutram-infra-dev sutram-pg-dev sutram-ch-ecs-dev sutram-web-dev sutram-live-dev sutram-deployment-dev; do
            status=$(aws cloudformation describe-stacks --stack-name $stack --region ap-south-1 --query 'Stacks[0].StackStatus' --output text)
            echo "$stack: $status"
          done

  deploy-all-prod:
    if: github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Install Wire
        run: go install github.com/google/wire/cmd/wire@latest

      - name: Deploy All Services to Prod
        run: |
          echo "Deploying all services in correct order..."
          
          # Make scripts executable
          chmod +x aws/scripts/*.sh
          
          # Deploy Infrastructure
          aws/scripts/infra.sh prod
          
          # Deploy PostgreSQL
          aws/scripts/pg.sh prod
          
          # Deploy ClickHouse
          aws/scripts/ch.sh prod
          
          # Deploy Web Service
          aws/scripts/web.sh prod
          
          # Deploy Live Service
          aws/scripts/live.sh prod
          
          # Deploy Deployment Service
          aws/scripts/deployment.sh prod

      - name: Verify All Deployments
        run: |
          echo "Verifying deployment status..."
          for stack in sutram-infra-prod sutram-pg-prod sutram-ch-ecs-prod sutram-web-prod sutram-live-prod sutram-deployment-prod; do
            status=$(aws cloudformation describe-stacks --stack-name $stack --region ap-south-1 --query 'Stacks[0].StackStatus' --output text)
            echo "$stack: $status"
          done
