AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - Deployment Service (ECS)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Description: Name of the infrastructure stack to import values from

  PostgreSQLStackName:
    Type: String
    Description: Name of the PostgreSQL stack to import values from

  ClickHouseStackName:
    Type: String
    Default: sutram-ch
    Description: Name of the ClickHouse stack to import values from

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5
    Description: Desired number of ECS tasks

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: CPU units for the ECS task (1 vCPU = 1024 units)

  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]
    Description: Memory in MB for the ECS task

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  # Application Load Balancer for Deployment Service
  DeploymentLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-ALB-SecurityGroup"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Public-Subnets"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-alb"
        - Key: Environment
          Value: !Ref Environment

  # Target Group for Deployment Service
  DeploymentTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-tg"
      Port: 8082
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${InfraStackName}-VPC-ID"
      HealthCheckPath: /health
      HealthCheckPort: 8082
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: ip
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-tg"
        - Key: Environment
          Value: !Ref Environment

  # ALB Listener for Deployment Service
  DeploymentALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DeploymentTargetGroup
      LoadBalancerArn: !Ref DeploymentLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Task Definition for Deployment Service
  DeploymentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-deployment"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskExecutionRole"
      TaskRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskRole"
      ContainerDefinitions:
        - Name: deployment
          Image: !Sub
            - "${ECRUri}:${ImageTag}"
            - ECRUri: !ImportValue
                Fn::Sub: "${InfraStackName}-Deployment-ECR-URI"
              ImageTag: !Ref ImageTag
          Essential: true
          PortMappings:
            - ContainerPort: 8082
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: APP_PORT
              Value: "8082"
            - Name: POSTGRES_HOST
              Value: !ImportValue
                Fn::Sub: "${PostgreSQLStackName}-PostgreSQL-DNS"
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: "sutram"
            - Name: POSTGRES_USER
              Value: "admin"
            - Name: POSTGRES_PASSWORD
              Value: "REDACTED_PASSWORD"
            - Name: CLICKHOUSE_HOST
              Value: !Sub "clickhouse.${ProjectName}-${Environment}.local"
            - Name: CLICKHOUSE_PORT
              Value: "8123"
            - Name: CLICKHOUSE_DB
              Value: "sutram"
            - Name: CLICKHOUSE_USER
              Value: "admin"
            - Name: CLICKHOUSE_PASSWORD
              Value: "REDACTED_PASSWORD"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "${InfraStackName}-Deployment-LogGroup"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - "CMD-SHELL"
              - "curl -f http://localhost:8082/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-task"
        - Key: Environment
          Value: !Ref Environment

  # ECS Service for Deployment
  DeploymentService:
    Type: AWS::ECS::Service
    DependsOn: DeploymentALBListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-deployment-service"
      Cluster: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-Cluster"
      TaskDefinition: !Ref DeploymentTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Web-SecurityGroup"
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Private-Subnets"
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: deployment
          ContainerPort: 8082
          TargetGroupArn: !Ref DeploymentTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      ServiceTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-service"
        - Key: Environment
          Value: !Ref Environment
      EnableExecuteCommand: !If [IsProduction, false, true]

  # Auto Scaling Target for Deployment Service
  DeploymentServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 5
      MinCapacity: 1
      ResourceId: !Sub "service/${ProjectName}-${Environment}-cluster/${ProjectName}-${Environment}-deployment-service"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Auto Scaling Policy - CPU for Deployment Service
  DeploymentServiceScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-deployment-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DeploymentServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Auto Scaling Policy - Memory for Deployment Service
  DeploymentServiceScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-deployment-memory-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DeploymentServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Route53 Record for Deployment Service
  DeploymentDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "deployment.${ProjectName}-${Environment}.local"
      Type: A
      AliasTarget:
        DNSName: !GetAtt DeploymentLoadBalancer.DNSName
        HostedZoneId: !GetAtt DeploymentLoadBalancer.CanonicalHostedZoneID

Outputs:
  DeploymentLoadBalancerDNSName:
    Description: Deployment Load Balancer DNS Name
    Value: !GetAtt DeploymentLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-LoadBalancer-DNS"

  DeploymentLoadBalancerHostedZoneId:
    Description: Deployment Load Balancer Hosted Zone ID
    Value: !GetAtt DeploymentLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-LoadBalancer-HostedZoneId"

  DeploymentServiceDNSName:
    Description: Deployment Service DNS Name (Route53)
    Value: !Sub "deployment.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-DNS"

  DeploymentServiceURL:
    Description: Deployment Service URL
    Value: !Sub "http://${DeploymentLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-URL"

  DeploymentServiceName:
    Description: ECS Service Name
    Value: !Ref DeploymentService
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-Service-Name"

  DeploymentTaskDefinitionArn:
    Description: Deployment Task Definition ARN
    Value: !Ref DeploymentTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-TaskDefinition"

  DeploymentTargetGroupArn:
    Description: Deployment Target Group ARN
    Value: !Ref DeploymentTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-TargetGroup-ARN"
