AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - CDN and Domain (CloudFront, Route 53, WAF)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  AppInfraStackName:
    Type: String
    Default: sutram-app-infra
    Description: Name of the app infrastructure stack to import values from

  DataStackName:
    Type: String
    Default: sutram-data
    Description: Name of the data stack to import values from

  DomainName:
    Type: String
    Default: ""
    Description: Domain name for the application (e.g., sutram.com)

  CreateRoute53HostedZone:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to create a new Route 53 hosted zone

  Route53HostedZoneId:
    Type: String
    Default: ""
    Description: Existing Route 53 Hosted Zone ID (if not creating new one)

  DisableCDN:
    Type: String
    Default: "true"  # Disable CDN for dev by default
    AllowedValues: ["true", "false"]
    Description: Disable CDN for cost optimization in development

  DisableWAF:
    Type: String
    Default: "true"  # Disable WAF for dev by default
    AllowedValues: ["true", "false"]
    Description: Disable WAF for cost optimization in development

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  CreateHostedZone: !And
    - !Equals [!Ref CreateRoute53HostedZone, "true"]
    - !Condition HasDomain
  UseExistingHostedZone: !And
    - !Not [!Equals [!Ref Route53HostedZoneId, ""]]
    - !Condition HasDomain
  IsProduction: !Equals [!Ref Environment, prod]
  EnableCDN: !And
    - !Equals [!Ref DisableCDN, "false"]
    - !Condition HasDomain
  EnableWAF: !And
    - !Equals [!Ref DisableWAF, "false"]
    - !Condition IsProduction

Resources:
  # ACM Certificate (only if domain is provided)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "*.${DomainName}"
        - !Sub "api.${DomainName}"
        - !Sub "live.${DomainName}"
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If
            - CreateHostedZone
            - !Ref Route53HostedZone
            - !Ref Route53HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-certificate"
        - Key: Environment
          Value: !Ref Environment

  # Route 53 Hosted Zone (optional)
  Route53HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${ProjectName} ${Environment}"
      HostedZoneTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-hosted-zone"
        - Key: Environment
          Value: !Ref Environment

  # WAF Web ACL
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-waf"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-CommonRuleSetMetric"
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-BadInputsRuleSetMetric"
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-IpReputationListMetric"
        - Name: RateLimitRule
          Priority: 4
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !If [IsProduction, 2000, 5000]
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-${Environment}-RateLimitMetric"
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-${Environment}-WebACLMetric"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-waf"
        - Key: Environment
          Value: !Ref Environment

  # CloudFront Origin Access Control for S3
  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasDomain
          - - !Ref DomainName
            - !Sub "www.${DomainName}"
          - !Ref AWS::NoValue
        Comment: !Sub "${ProjectName} ${Environment} CDN"
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: !If [IsProduction, PriceClass_All, PriceClass_100]
        WebACLId: !GetAtt WebACL.Arn
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref SSLCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          # ALB Origin for API and WebSocket traffic
          - Id: ALBOrigin
            DomainName: !ImportValue
              Fn::Sub: "${AppInfraStackName}-${Environment}-ALB-DNSName"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: redirect-to-https
              OriginSSLProtocols:
                - TLSv1.2
          # S3 Origin for static assets
          - Id: S3Origin
            DomainName: !Sub
              - "${Bucket}.s3.${AWS::Region}.amazonaws.com"
              - Bucket: !ImportValue
                  Fn::Sub: "${DataStackName}-${Environment}-AppAssets-Bucket"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref S3OriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
          Compress: true
        CacheBehaviors:
          # API routes - no caching
          - PathPattern: "/api/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
            Compress: true
          # WebSocket routes - no caching
          - PathPattern: "/ws/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          # Live trading routes - no caching
          - PathPattern: "/live/*"
            TargetOriginId: ALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          # Static assets from S3 - aggressive caching
          - PathPattern: "/static/*"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
            Compress: true
          # Assets from S3 - moderate caching
          - PathPattern: "/assets/*"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        Logging:
          Bucket: !Sub
            - "${Bucket}.s3.amazonaws.com"
            - Bucket: !ImportValue
                Fn::Sub: "${DataStackName}-${Environment}-AppAssets-Bucket"
          Prefix: "cloudfront-logs/"
          IncludeCookies: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-cloudfront"
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket Policy for CloudFront
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue
        Fn::Sub: "${DataStackName}-${Environment}-AppAssets-Bucket"
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - "${BucketArn}/*"
              - BucketArn: !Sub
                - "arn:aws:s3:::${Bucket}"
                - Bucket: !ImportValue
                    Fn::Sub: "${DataStackName}-${Environment}-AppAssets-Bucket"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # Route 53 Records (if domain is provided)
  Route53RecordSetA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref Route53HostedZone
        - !Ref Route53HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  Route53RecordSetAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref Route53HostedZone
        - !Ref Route53HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  Route53RecordSetWWW:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref Route53HostedZone
        - !Ref Route53HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  # API subdomain (optional)
  Route53RecordSetAPI:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref Route53HostedZone
        - !Ref Route53HostedZoneId
      Name: !Sub "api.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !ImportValue
          Fn::Sub: "${AppInfraStackName}-${Environment}-ALB-DNSName"
        HostedZoneId: !ImportValue
          Fn::Sub: "${AppInfraStackName}-${Environment}-ALB-HostedZoneId"
        EvaluateTargetHealth: true

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  CreateHostedZone: !And
    - !Condition HasDomain
    - !Equals [!Ref CreateRoute53HostedZone, "true"]

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFront-Distribution-ID"

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFront-Domain-Name"

  WebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WebACL-ARN"

  SSLCertificateArn:
    Description: SSL Certificate ARN
    Condition: HasDomain
    Value: !Ref SSLCertificate
    Export:
      Name: !Sub "${AWS::StackName}-SSL-Certificate-ARN"

  Route53HostedZoneId:
    Description: Route 53 Hosted Zone ID
    Condition: CreateHostedZone
    Value: !Ref Route53HostedZone
    Export:
      Name: !Sub "${AWS::StackName}-Route53-HostedZone-ID"

  PrimaryDomainName:
    Description: Primary domain name for the application
    Condition: HasDomain
    Value: !Ref DomainName
    Export:
      Name: !Sub "${AWS::StackName}-Primary-Domain-Name"

  ApplicationURL:
    Description: Application URL
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-Application-URL"
