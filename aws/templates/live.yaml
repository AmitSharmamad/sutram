AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Live Service on ECS'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  CPU:
    Type: Number
    Default: 256
  Memory:
    Type: Number
    Default: 512
  LivePort:
    Type: Number
    Default: 8081
  ImageTag:
    Type: String
    Default: latest

Resources:
  # Security Group for Live Service
  LiveSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Live Service
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        # Allow access only from other ECS services (like web service)
        - IpProtocol: tcp
          FromPort: !Ref LivePort
          ToPort: !Ref LivePort
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-sg"

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}-live"
      RetentionInDays: !If [IsProd, 30, 7]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-live"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CPU
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-execution-role-arn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-task-role-arn"
      ContainerDefinitions:
        - Name: live
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-live:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref LivePort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref LivePort
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
            - Name: DATABASE_URL
              Value: !Sub 
                - "postgresql://${DBUsername}:${DBPassword}@${DBEndpoint}:${DBPort}/${DBName}?sslmode=require"
                - DBUsername: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-username"
                  DBPassword: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-password"
                  DBEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
                  DBPort: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
                  DBName: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-name"
            - Name: CH_URL
              Value: !Sub 
                - "clickhouse://sutram_user:change_me_clickhouse@${ClickHouseEndpoint}:9000/sutram"
                - ClickHouseEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-clickhouse-endpoint"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ECS Service
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-live"
      Cluster:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-cluster"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [IsProd, 2, 1]
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
            - !Ref LiveSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
          AssignPublicIp: DISABLED

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Outputs:
  ServiceName:
    Description: Live Service Name
    Value: !Ref Service
    Export:
      Name: !Sub "${ProjectName}-${Environment}-live-service"

  LiveSecurityGroup:
    Description: Live Service Security Group ID
    Value: !Ref LiveSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-live-sg-id"
