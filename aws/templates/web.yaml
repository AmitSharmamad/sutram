AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Web Service on ECS'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  CPU:
    Type: Number
    Default: 256
  Memory:
    Type: Number
    Default: 512
  WebPort:
    Type: Number
    Default: 8080
  ImageTag:
    Type: String
    Default: latest
  ForceUpdate:
    Type: String
    Default: ""
    Description: Timestamp to force ECS service update even with same image tag
  GoogleOAuthClientId:
    Type: String
    Default: REDACTED_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com
    Description: Google OAuth Client ID
  GoogleOAuthClientSecret:
    Type: String
    Default: REDACTED_GOOGLE_OAUTH_CLIENT_SECRET
    Description: Google OAuth Client Secret
    NoEcho: true
  GoogleOAuthRedirectURL:
    Type: String
    Default: ""
    Description: Google OAuth Redirect URL (will be auto-generated if empty)
  PublicHostedZoneId:
    Type: String
    Description: Route53 Public Hosted Zone ID for domain validation
  ExistingCertificateArn:
    Type: String
    Default: ""
    Description: Existing SSL Certificate ARN in ap-south-1 region (leave empty to create new)
  BaseDomainName:
    Type: String
    Default: sutram.co
    Description: Base domain name

Resources:
  # SSL Certificate for HTTPS (conditional - only create if not using existing)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateNewCertificate
    Properties:
      DomainName: !If [IsProd, !Sub "web.${BaseDomainName}", !Sub "web.dev.${BaseDomainName}"]
      SubjectAlternativeNames:
        - !If [IsProd, !Sub "*.${BaseDomainName}", !Sub "*.dev.${BaseDomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !If [IsProd, !Sub "web.${BaseDomainName}", !Sub "web.dev.${BaseDomainName}"]
          HostedZoneId: !Ref PublicHostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-ssl-cert"

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-public-subnet-1-id"
        - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-public-subnet-2-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-alb"

  # Security Group for ALB
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-alb-sg"

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-tg"
      Port: !Ref WebPort
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # HTTPS Listener (primary) - force replacement with new name
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If [CreateNewCertificate, !Ref SSLCertificate, !Ref ExistingCertificateArn]

  # HTTP to HTTPS Redirect Listener
  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # Update ECS Security Group to allow ALB traffic
  ECSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      IpProtocol: tcp
      FromPort: !Ref WebPort
      ToPort: !Ref WebPort
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}-web"
      RetentionInDays: !If [IsProd, 30, 7]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-web"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CPU
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-execution-role-arn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-task-role-arn"
      ContainerDefinitions:
        - Name: web
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-web:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref WebPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref WebPort
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: FORCE_UPDATE
              Value: !Ref ForceUpdate
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
            - Name: DATABASE_URL
              Value: !Sub 
                - "postgresql://${DBUsername}:${DBPassword}@${DBEndpoint}:${DBPort}/${DBName}?sslmode=require"
                - DBUsername: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-username"
                  DBPassword: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-password"
                  DBEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
                  DBPort: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
                  DBName: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-name"
            - Name: CH_URL
              Value: !Sub 
                - "clickhouse://sutram_user:REDACTED_PASSWORD@${ClickHouseEndpoint}:9000/sutram"
                - ClickHouseEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-clickhouse-endpoint"
            - Name: GOOGLE_OAUTH_CLIENT_ID
              Value: !Ref GoogleOAuthClientId
            - Name: GOOGLE_OAUTH_CLIENT_SECRET
              Value: !Ref GoogleOAuthClientSecret
            - Name: GOOGLE_OAUTH_REDIRECT_URL
              Value: !If 
                - UseCustomRedirectURL
                - !Ref GoogleOAuthRedirectURL
                - !Sub "https://${WebDNSRecord}/api/auth/oauth/google/callback"
            - Name: WEB_HTTP_PORT
              Value: !Ref WebPort
            - Name: GIN_MODE
              Value: !If [IsProd, "release", "debug"]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ECS Service
  Service:
    Type: AWS::ECS::Service
    DependsOn: 
      - HTTPSListener
      - HTTPRedirectListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-web"
      Cluster:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-cluster"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [IsProd, 2, 1]
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: web
          ContainerPort: !Ref WebPort
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
          AssignPublicIp: DISABLED

  # Route53 Public Record for Web Service
  WebDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PublicHostedZoneId
      Name: !If [IsProd, !Sub "web.${BaseDomainName}", !Sub "web.dev.${BaseDomainName}"]
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  UseCustomRedirectURL: !Not [!Equals [!Ref GoogleOAuthRedirectURL, ""]]
  CreateNewCertificate: !Equals [!Ref ExistingCertificateArn, ""]

Outputs:
  LoadBalancerDNS:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-web-alb-dns"

  LoadBalancerURL:
    Description: Application Load Balancer URL
    Value: !Sub "https://${WebDNSRecord}"

  ServiceDomain:
    Description: Custom domain for Web Service
    Value: !If [IsProd, !Sub "web.${BaseDomainName}", !Sub "web.dev.${BaseDomainName}"]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-web-domain"

  ServiceURL:
    Description: Custom URL for Web Service
    Value: !If [IsProd, !Sub "https://web.${BaseDomainName}", !Sub "https://web.dev.${BaseDomainName}"]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-web-url"

  SSLCertificateArn:
    Description: SSL Certificate ARN
    Value: !If [CreateNewCertificate, !Ref SSLCertificate, !Ref ExistingCertificateArn]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-web-ssl-cert-arn"
