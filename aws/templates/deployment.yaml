AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Deployment Service on ECS'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  CPU:
    Type: Number
    Default: 256
  Memory:
    Type: Number
    Default: 512
  DeploymentPort:
    Type: Number
    Default: 8082
  ImageTag:
    Type: String
    Default: latest
  BaseDomainName:
    Type: String
    Default: sutram.co
    Description: Base domain name
  PublicHostedZoneId:
    Type: String
    Description: Route53 Public Hosted Zone ID for domain validation
  ExistingCertificateArn:
    Type: String
    Default: ""
    Description: Existing SSL Certificate ARN in ap-south-1 region (leave empty to create new)

Resources:
  # SSL Certificate for HTTPS (conditional - only create if not using existing)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateNewCertificate
    Properties:
      DomainName: !If [IsProd, !Sub "deploy.${BaseDomainName}", !Sub "deploy.dev.${BaseDomainName}"]
      SubjectAlternativeNames:
        - !If [IsProd, !Sub "*.${BaseDomainName}", !Sub "*.dev.${BaseDomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !If [IsProd, !Sub "deploy.${BaseDomainName}", !Sub "deploy.dev.${BaseDomainName}"]
          HostedZoneId: !Ref PublicHostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-ssl-cert"

  # Internal Application Load Balancer (internal-only)
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-alb"
      Scheme: internal
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
        - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-alb"

  # Security Group for ALB (internal access only)
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Deployment ALB (internal)
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        # Allow HTTP from VPC
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/16
        # Allow HTTPS from VPC
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
        # Allow access from other ECS services
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-alb-sg"
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-alb-sg"

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-tg"
      Port: !Ref DeploymentPort
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # HTTPS Listener (primary)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If [CreateNewCertificate, !Ref SSLCertificate, !Ref ExistingCertificateArn]

  # HTTP to HTTPS Redirect Listener
  HTTPRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # Security Group for Deployment Service
  DeploymentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Deployment Service
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        # Allow access from ALB
        - IpProtocol: tcp
          FromPort: !Ref DeploymentPort
          ToPort: !Ref DeploymentPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow access from other ECS services
        - IpProtocol: tcp
          FromPort: !Ref DeploymentPort
          ToPort: !Ref DeploymentPort
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-sg"

  # Update ECS Security Group to allow ALB traffic
  ECSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      IpProtocol: tcp
      FromPort: !Ref DeploymentPort
      ToPort: !Ref DeploymentPort
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}-deployment"
      RetentionInDays: !If [IsProd, 30, 7]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-deployment"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CPU
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-execution-role-arn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-task-role-arn"
      ContainerDefinitions:
        - Name: deployment
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-deployment:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref DeploymentPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref DeploymentPort
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
            - Name: DATABASE_URL
              Value: !Sub 
                - "postgresql://${DBUsername}:${DBPassword}@${DBEndpoint}:${DBPort}/${DBName}?sslmode=require"
                - DBUsername: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-username"
                  DBPassword: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-password"
                  DBEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-endpoint"
                  DBPort: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-port"
                  DBName: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-db-name"
            - Name: CH_URL
              Value: !Sub 
                - "clickhouse://sutram_user:REDACTED_PASSWORD@${ClickHouseEndpoint}:9000/sutram"
                - ClickHouseEndpoint: 
                    Fn::ImportValue: !Sub "${ProjectName}-${Environment}-clickhouse-endpoint"
            - Name: WEB_HTTP_HOST
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-web-alb-dns"
            - Name: WEB_HTTP_PORT
              Value: "80"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ECS Service
  Service:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-deployment"
      Cluster:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-cluster"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [IsProd, 2, 1]
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: deployment
          ContainerPort: !Ref DeploymentPort
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
            - !Ref DeploymentSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
          AssignPublicIp: DISABLED

  # Route53 Record for Deployment Service (internal)
  DeploymentDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PublicHostedZoneId
      Name: !If [IsProd, !Sub "deploy.${BaseDomainName}", !Sub "deploy.dev.${BaseDomainName}"]
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  CreateNewCertificate: !Equals [!Ref ExistingCertificateArn, ""]
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
          AssignPublicIp: DISABLED

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  CreateNewCertificate: !Equals [!Ref ExistingCertificateArn, ""]

Outputs:
  LoadBalancerDNS:
    Description: Deployment Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-deployment-alb-dns"

  LoadBalancerURL:
    Description: Deployment Application Load Balancer URL
    Value: !Sub "https://${DeploymentDNSRecord}"

  ServiceDomain:
    Description: Custom domain for Deployment Service (internal)
    Value: !If [IsProd, !Sub "deploy.${BaseDomainName}", !Sub "deploy.dev.${BaseDomainName}"]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-deployment-domain"

  ServiceURL:
    Description: Custom URL for Deployment Service (internal)
    Value: !If [IsProd, !Sub "https://deploy.${BaseDomainName}", !Sub "https://deploy.dev.${BaseDomainName}"]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-deployment-url"

  ServiceName:
    Description: Deployment Service Name
    Value: !Ref Service
    Export:
      Name: !Sub "${ProjectName}-${Environment}-deployment-service"

  DeploymentSecurityGroup:
    Description: Deployment Service Security Group ID
    Value: !Ref DeploymentSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-deployment-sg-id"
