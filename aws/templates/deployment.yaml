AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - Deployment Service'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Default: sutram-infra
    Description: Name of the infrastructure stack to import values from

  PostgreSQLStackName:
    Type: String
    Default: sutram-pg
    Description: Name of the PostgreSQL stack to import values from

  ClickHouseStackName:
    Type: String
    Default: sutram-ch
    Description: Name of the ClickHouse stack to import values from

  DeploymentInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: EC2 instance type for deployment service

  DesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5
    Description: Desired number of instances in Auto Scaling Group

  MaxSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 5
    Description: Maximum number of instances in Auto Scaling Group

  MinSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5
    Description: Minimum number of instances in Auto Scaling Group

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Default: ""

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Mappings:
  RegionMap:
    ap-south-1:
      AMI: ami-0f5ee92e2d63afc18  # Amazon Linux 2 AMI

Resources:
  # Application Load Balancer for Deployment Service
  DeploymentLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-ALB-SecurityGroup"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Public-Subnets"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-alb"
        - Key: Environment
          Value: !Ref Environment

  # Target Group for Deployment Service
  DeploymentTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-deployment-tg"
      Port: 8082
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${InfraStackName}-VPC-ID"
      HealthCheckPath: /health
      HealthCheckPort: 8082
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: instance
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-tg"
        - Key: Environment
          Value: !Ref Environment

  # ALB Listener for Deployment Service
  DeploymentALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DeploymentTargetGroup
      LoadBalancerArn: !Ref DeploymentLoadBalancer
      Port: 80
      Protocol: HTTP

  # Launch Template for Deployment Service
  DeploymentLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${Environment}-deployment-lt"
      LaunchTemplateData:
        ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
        InstanceType: !Ref DeploymentInstanceType
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: "${InfraStackName}-Web-SecurityGroup"
        IamInstanceProfile:
          Arn: !GetAtt DeploymentInstanceProfile.Arn
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: !If [IsProduction, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y golang git docker
            
            # Start Docker
            systemctl start docker
            systemctl enable docker
            usermod -a -G docker ec2-user
            
            # Create app user
            useradd -m -s /bin/bash sutram
            usermod -a -G docker sutram
            
            # Create application directory
            mkdir -p /opt/sutram
            chown sutram:sutram /opt/sutram
            
            # Set environment variables
            cat > /etc/environment << 'EOF'
            POSTGRES_HOST=${PostgreSQLStackName}-PostgreSQL-DNS
            POSTGRES_PORT=5432
            POSTGRES_DB=sutram
            POSTGRES_USER=admin
            POSTGRES_PASSWORD=REDACTED_PASSWORD
            CLICKHOUSE_HOST=${ClickHouseStackName}-ClickHouse-DNS
            CLICKHOUSE_PORT=9000
            CLICKHOUSE_DB=sutram
            CLICKHOUSE_USER=admin
            CLICKHOUSE_PASSWORD=REDACTED_PASSWORD
            APP_ENV=${Environment}
            APP_PORT=8082
            SERVICE_TYPE=deployment
            DOCKER_HOST=unix:///var/run/docker.sock
            EOF
            
            # Create systemd service
            cat > /etc/systemd/system/sutram-deployment.service << 'EOF'
            [Unit]
            Description=Sutram Deployment Service
            After=network.target docker.service
            Requires=docker.service
            
            [Service]
            Type=simple
            User=sutram
            WorkingDirectory=/opt/sutram
            ExecStart=/opt/sutram/deployment
            Restart=always
            RestartSec=10
            EnvironmentFile=/etc/environment
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Enable service
            systemctl daemon-reload
            systemctl enable sutram-deployment
            
            # Create health check endpoint script
            cat > /opt/sutram/health.sh << 'EOF'
            #!/bin/bash
            # Simple health check - can be enhanced based on actual requirements
            curl -f http://localhost:8082/health || exit 1
            EOF
            chmod +x /opt/sutram/health.sh
            
            # Note: In production, you would deploy the actual binary here
            # For now, create a simple placeholder that responds to health checks
            cat > /opt/sutram/placeholder.go << 'EOF'
            package main
            
            import (
                "fmt"
                "net/http"
                "os"
                "encoding/json"
            )
            
            type DeploymentStatus struct {
                Service string `json:"service"`
                Status  string `json:"status"`
                Message string `json:"message"`
            }
            
            func main() {
                http.HandleFunc("/health", func(w http.ResponseWriter, r *http.Request) {
                    w.WriteHeader(http.StatusOK)
                    fmt.Fprintf(w, "OK")
                })
                
                http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                    w.WriteHeader(http.StatusOK)
                    fmt.Fprintf(w, "Sutram Deployment Service - ${Environment}")
                })
                
                http.HandleFunc("/deploy", func(w http.ResponseWriter, r *http.Request) {
                    w.Header().Set("Content-Type", "application/json")
                    status := DeploymentStatus{
                        Service: "deployment",
                        Status:  "ready",
                        Message: "Deployment service is ready to accept deployment requests",
                    }
                    json.NewEncoder(w).Encode(status)
                })
                
                http.HandleFunc("/status", func(w http.ResponseWriter, r *http.Request) {
                    w.Header().Set("Content-Type", "application/json")
                    status := DeploymentStatus{
                        Service: "deployment",
                        Status:  "running",
                        Message: "All services operational",
                    }
                    json.NewEncoder(w).Encode(status)
                })
                
                port := os.Getenv("APP_PORT")
                if port == "" {
                    port = "8082"
                }
                
                fmt.Printf("Starting deployment service on port %s\n", port)
                http.ListenAndServe(":"+port, nil)
            }
            EOF
            
            # Build and start placeholder service
            cd /opt/sutram
            su sutram -c "go mod init sutram-deployment && go build -o deployment placeholder.go"
            systemctl start sutram-deployment
            
            # Signal CloudFormation
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource DeploymentAutoScalingGroup --region ${AWS::Region}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-${Environment}-deployment"
              - Key: Environment
                Value: !Ref Environment

  # Auto Scaling Group for Deployment Service
  DeploymentAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${Environment}-deployment-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref DeploymentLaunchTemplate
        Version: !GetAtt DeploymentLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Private-Subnets"
      TargetGroupARNs:
        - !Ref DeploymentTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-instance"
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true
    CreationPolicy:
      ResourceSignal:
        Count: !Ref DesiredCapacity
        Timeout: PT10M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: true

  # IAM Role for Deployment Instances
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-deployment-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: DeploymentServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"
              - Effect: Allow
                Action:
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeLaunchTemplates
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-role"
        - Key: Environment
          Value: !Ref Environment

  DeploymentInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-deployment-profile"
      Roles:
        - !Ref DeploymentRole

  # S3 Bucket for Deployment Artifacts
  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-deployment-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: !If [IsProduction, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: ArtifactCleanup
            Status: Enabled
            ExpirationInDays: !If [IsProduction, 30, 7]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-deployment-artifacts"
        - Key: Environment
          Value: !Ref Environment

  # Route53 Record for Deployment Service
  DeploymentDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "deployment.${ProjectName}-${Environment}.local"
      Type: A
      AliasTarget:
        DNSName: !GetAtt DeploymentLoadBalancer.DNSName
        HostedZoneId: !GetAtt DeploymentLoadBalancer.CanonicalHostedZoneID

Outputs:
  DeploymentLoadBalancerDNSName:
    Description: Deployment Service Load Balancer DNS Name
    Value: !GetAtt DeploymentLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-LoadBalancer-DNS"

  DeploymentLoadBalancerHostedZoneId:
    Description: Deployment Service Load Balancer Hosted Zone ID
    Value: !GetAtt DeploymentLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-LoadBalancer-HostedZoneId"

  DeploymentServiceDNSName:
    Description: Deployment Service DNS Name (Route53)
    Value: !Sub "deployment.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-DNS"

  DeploymentServiceURL:
    Description: Deployment Service URL
    Value: !Sub "http://${DeploymentLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-URL"

  DeploymentAutoScalingGroupName:
    Description: Deployment Service Auto Scaling Group Name
    Value: !Ref DeploymentAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-AutoScalingGroup-Name"

  DeploymentTargetGroupArn:
    Description: Deployment Service Target Group ARN
    Value: !Ref DeploymentTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-TargetGroup-ARN"

  DeploymentArtifactsBucketName:
    Description: Deployment Artifacts S3 Bucket Name
    Value: !Ref DeploymentArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-Deployment-Artifacts-Bucket"
