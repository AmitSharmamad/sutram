AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - ClickHouse Database'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Default: sutram-infra
    Description: Name of the infrastructure stack to import values from

  ClickHouseInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, c5n.large, c5n.xlarge, c5n.2xlarge]
    Description: EC2 instance type for ClickHouse

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Default: ""

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Mappings:
  RegionMap:
    ap-south-1:
      AMI: ami-0f5ee92e2d63afc18  # Amazon Linux 2 AMI

Resources:
  # ClickHouse EC2 Instance
  ClickHouseInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ClickHouseInstanceType
      ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Select [0, !Split [",", !ImportValue
        Fn::Sub: "${InfraStackName}-Private-Subnets"]]
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Database-SecurityGroup"
      IamInstanceProfile: !Ref ClickHouseInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !If [IsProduction, 100, 20]
            VolumeType: gp3
            Encrypted: !If [IsProduction, true, false]
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ec2-user
          
          # Install ClickHouse via Docker
          mkdir -p /opt/clickhouse/data
          mkdir -p /opt/clickhouse/logs
          mkdir -p /opt/clickhouse/config
          
          # Create ClickHouse configuration
          cat > /opt/clickhouse/config/users.xml << 'EOF'
          <yandex>
              <users>
                  <default>
                      <password></password>
                      <networks incl="networks_config"/>
                      <profile>default</profile>
                      <quota>default</quota>
                  </default>
                  <admin>
                      <password>clickhouse123</password>
                      <networks>
                          <ip>::/0</ip>
                      </networks>
                      <profile>default</profile>
                      <quota>default</quota>
                      <access_management>1</access_management>
                  </admin>
              </users>
          </yandex>
          EOF
          
          cat > /opt/clickhouse/config/config.xml << 'EOF'
          <yandex>
              <logger>
                  <level>warning</level>
                  <console>true</console>
              </logger>
              <http_port>8123</http_port>
              <tcp_port>9000</tcp_port>
              <listen_host>0.0.0.0</listen_host>
              <max_connections>4096</max_connections>
              <keep_alive_timeout>3</keep_alive_timeout>
              <max_concurrent_queries>100</max_concurrent_queries>
              <uncompressed_cache_size>8589934592</uncompressed_cache_size>
              <mark_cache_size>5368709120</mark_cache_size>
              <path>/var/lib/clickhouse/</path>
              <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
              <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
              <users_config>users.xml</users_config>
              <default_profile>default</default_profile>
              <default_database>default</default_database>
              <timezone>UTC</timezone>
              <mlock_executable>false</mlock_executable>
          </yandex>
          EOF
          
          # Run ClickHouse container
          docker run -d \
            --name clickhouse-server \
            --restart unless-stopped \
            -p 8123:8123 \
            -p 9000:9000 \
            -v /opt/clickhouse/data:/var/lib/clickhouse \
            -v /opt/clickhouse/logs:/var/log/clickhouse-server \
            -v /opt/clickhouse/config/config.xml:/etc/clickhouse-server/config.xml \
            -v /opt/clickhouse/config/users.xml:/etc/clickhouse-server/users.xml \
            clickhouse/clickhouse-server:latest
          
          # Wait for ClickHouse to start
          sleep 30
          
          # Create sutram database
          docker exec clickhouse-server clickhouse-client --query "CREATE DATABASE IF NOT EXISTS sutram"
          
          # Signal CloudFormation
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource ClickHouseInstance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-clickhouse"
        - Key: Environment
          Value: !Ref Environment
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M

  # IAM Role for ClickHouse Instance
  ClickHouseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-clickhouse-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ClickHousePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-clickhouse-role"
        - Key: Environment
          Value: !Ref Environment

  ClickHouseInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-clickhouse-profile"
      Roles:
        - !Ref ClickHouseRole

  # Route53 Record for ClickHouse
  ClickHouseDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "clickhouse.${ProjectName}-${Environment}.local"
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt ClickHouseInstance.PrivateIp

Outputs:
  ClickHouseInstanceId:
    Description: ClickHouse Instance ID
    Value: !Ref ClickHouseInstance
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-InstanceId"

  ClickHousePrivateIP:
    Description: ClickHouse Private IP Address
    Value: !GetAtt ClickHouseInstance.PrivateIp
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-PrivateIP"

  ClickHouseHTTPEndpoint:
    Description: ClickHouse HTTP Endpoint
    Value: !Sub "${ClickHouseInstance.PrivateIp}:8123"
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-HTTP-Endpoint"

  ClickHouseTCPEndpoint:
    Description: ClickHouse TCP Endpoint
    Value: !Sub "${ClickHouseInstance.PrivateIp}:9000"
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-TCP-Endpoint"

  ClickHouseDNSName:
    Description: ClickHouse DNS Name (Route53)
    Value: !Sub "clickhouse.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-DNS"

  ClickHouseConnectionString:
    Description: ClickHouse Connection String
    Value: !Sub "clickhouse://admin:clickhouse123@${ClickHouseDNSRecord}:9000/sutram"
    Export:
      Name: !Sub "${AWS::StackName}-ClickHouse-ConnectionString"
