AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - Application Infrastructure (ECS, ALB, ECR)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  NetworkingStackName:
    Type: String
    Default: sutram-networking
    Description: Name of the networking stack to import values from

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN for HTTPS (optional)

  DomainName:
    Type: String
    Default: ""
    Description: Domain name for the application (optional)

  UseFargateSpot:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Use FARGATE_SPOT for cost optimization

  DisableContainerInsights:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Disable container insights for cost optimization

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  UseFargateSpotCondition: !Equals [!Ref UseFargateSpot, "true"]
  EnableContainerInsights: !And 
    - !Equals [!Ref DisableContainerInsights, "false"]
    - !Equals [!Ref Environment, prod]

Resources:
  # ECS Cluster - Cost Optimized
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${Environment}-cluster"
      CapacityProviders:
        - FARGATE
        - !If [UseFargateSpotCondition, FARGATE_SPOT, !Ref 'AWS::NoValue']
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !If [UseFargateSpotCondition, FARGATE_SPOT, FARGATE]
          Weight: 1
        - !If 
          - UseFargateSpotCondition
          - CapacityProvider: FARGATE
            Weight: 0
          - !Ref 'AWS::NoValue'
      ClusterSettings:
        - Name: containerInsights
          Value: !If [EnableContainerInsights, enabled, disabled]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-cluster"
        - Key: Environment
          Value: !Ref Environment

  # ECR Repositories
  WebAppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}/${Environment}/web-app"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Delete untagged images older than 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-app-repo"
        - Key: Environment
          Value: !Ref Environment

  LiveTradingRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}/${Environment}/live-trading"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Delete untagged images older than 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-trading-repo"
        - Key: Environment
          Value: !Ref Environment

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${NetworkingStackName}-${Environment}-Public-Subnets"
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${NetworkingStackName}-${Environment}-ALB-SecurityGroup"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-alb"
        - Key: Environment
          Value: !Ref Environment

  # Target Groups
  WebAppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-app-tg"
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: "${NetworkingStackName}-${Environment}-VPC-ID"
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-app-tg"
        - Key: Environment
          Value: !Ref Environment

  LiveTradingTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-live-trading-tg"
      Port: 8010
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: "${NetworkingStackName}-${Environment}-VPC-ID"
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: 86400
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-trading-tg"
        - Key: Environment
          Value: !Ref Environment

  # ALB Listeners
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebAppTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01

  HTTPSListenerNoCert:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebAppTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTP

  # Listener Rules
  APIListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebAppTargetGroup
      Conditions:
        - Field: path-pattern
          Values: ["/api/*"]
      ListenerArn: !If
        - HasCertificate
        - !Ref HTTPSListener
        - !Ref HTTPSListenerNoCert
      Priority: 100

  WebSocketListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref LiveTradingTargetGroup
      Conditions:
        - Field: path-pattern
          Values: ["/ws/*", "/live/*"]
      ListenerArn: !If
        - HasCertificate
        - !Ref HTTPSListener
        - !Ref HTTPSListenerNoCert
      Priority: 200

  # CloudWatch Log Groups
  WebAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/${Environment}/web-app"
      RetentionInDays: !If [IsProduction, 30, 7]
      KmsKeyId: !ImportValue
        Fn::Sub: "${NetworkingStackName}-${Environment}-KMS-Key-ARN"

  LiveTradingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/${Environment}/live-trading"
      RetentionInDays: !If [IsProduction, 30, 7]
      KmsKeyId: !ImportValue
        Fn::Sub: "${NetworkingStackName}-${Environment}-KMS-Key-ARN"

  # ECS Task Execution Role
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !ImportValue
                  Fn::Sub: "${NetworkingStackName}-${Environment}-KMS-Key-ARN"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ecs-execution-role"

  # ECS Task Role
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApplicationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*/*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub "${ProjectName}/${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ecs-task-role"

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCertificate: !Equals [!Ref CertificateArn, ""]

Outputs:
  ECSClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECS-Cluster-ARN"

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ECS-Cluster-Name"

  ALBArn:
    Description: Application Load Balancer ARN
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub "${AWS::StackName}-ALB-ARN"

  ALBDNSName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ALB-DNSName"

  ALBHostedZoneId:
    Description: Application Load Balancer Hosted Zone ID
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-ALB-HostedZoneId"

  WebAppTargetGroupArn:
    Description: Web App Target Group ARN
    Value: !Ref WebAppTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebApp-TargetGroup-ARN"

  LiveTradingTargetGroupArn:
    Description: Live Trading Target Group ARN
    Value: !Ref LiveTradingTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-LiveTrading-TargetGroup-ARN"

  WebAppRepositoryUri:
    Description: Web App ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${WebAppRepository}"
    Export:
      Name: !Sub "${AWS::StackName}-WebApp-Repository-URI"

  LiveTradingRepositoryUri:
    Description: Live Trading ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${LiveTradingRepository}"
    Export:
      Name: !Sub "${AWS::StackName}-LiveTrading-Repository-URI"

  ECSTaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECS-TaskExecution-Role-ARN"

  ECSTaskRoleArn:
    Description: ECS Task Role ARN
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECS-Task-Role-ARN"

  WebAppLogGroupName:
    Description: Web App CloudWatch Log Group Name
    Value: !Ref WebAppLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebApp-LogGroup-Name"

  LiveTradingLogGroupName:
    Description: Live Trading CloudWatch Log Group Name
    Value: !Ref LiveTradingLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-LiveTrading-LogGroup-Name"
