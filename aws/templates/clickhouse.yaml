AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram ClickHouse on ECS with EFS'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  CPU:
    Type: Number
    Default: 256
  Memory:
    Type: Number
    Default: 512

Resources:
  # EFS File System for ClickHouse data
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: provisioned
      ProvisionedThroughputInMibps: !If [IsProd, 100, 10]
      FileSystemTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-clickhouse-efs"

  # EFS Mount Targets
  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # Security Group for EFS
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-efs-sg"

  # Security Group for ClickHouse
  ClickHouseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ClickHouse
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-vpc-id"
      SecurityGroupIngress:
        # Allow HTTP interface (8123) only from ECS services
        - IpProtocol: tcp
          FromPort: 8123
          ToPort: 8123
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
        # Allow Native interface (9000) only from ECS services
        - IpProtocol: tcp
          FromPort: 9000
          ToPort: 9000
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-clickhouse-sg"

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}-clickhouse"
      RetentionInDays: !If [IsProd, 30, 7]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-clickhouse"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CPU
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-execution-role-arn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-task-role-arn"
      Volumes:
        - Name: clickhouse-data
          EFSVolumeConfiguration:
            FileSystemId: !Ref EFSFileSystem
            RootDirectory: /
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: clickhouse
          Image: clickhouse/clickhouse-server:latest
          Essential: true
          PortMappings:
            - ContainerPort: 8123
              Protocol: tcp
            - ContainerPort: 9000
              Protocol: tcp
          Environment:
            - Name: CLICKHOUSE_DB
              Value: sutram
            - Name: CLICKHOUSE_USER
              Value: sutram_user
            - Name: CLICKHOUSE_PASSWORD
              Value: REDACTED_PASSWORD
          MountPoints:
            - SourceVolume: clickhouse-data
              ContainerPath: /var/lib/clickhouse
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # Service Discovery Service
  ServiceDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: clickhouse
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 300
        NamespaceId:
          Fn::ImportValue: !Sub "${ProjectName}-${Environment}-service-discovery-namespace"
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ECS Service
  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-clickhouse"
      Cluster:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-cluster"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      ServiceRegistries:
        - RegistryArn: !GetAtt ServiceDiscoveryService.Arn
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-ecs-sg-id"
            - !Ref ClickHouseSecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-1-id"
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-private-subnet-2-id"
          AssignPublicIp: DISABLED

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Outputs:
  EFSFileSystemId:
    Description: EFS File System ID
    Value: !Ref EFSFileSystem
    Export:
      Name: !Sub "${ProjectName}-${Environment}-efs-id"

  ClickHouseSecurityGroup:
    Description: ClickHouse Security Group ID
    Value: !Ref ClickHouseSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-clickhouse-sg-id"

  ClickHouseServiceName:
    Description: ClickHouse Service Name
    Value: !Ref Service
    Export:
      Name: !Sub "${ProjectName}-${Environment}-clickhouse-service-name"

  ClickHouseServiceEndpoint:
    Description: ClickHouse Service Endpoint (for internal access)
    Value: !Sub "clickhouse.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${ProjectName}-${Environment}-clickhouse-endpoint"
