AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - Web Service (ECS)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Description: Name of the infrastructure stack to import values from

  PostgreSQLStackName:
    Type: String
    Description: Name of the PostgreSQL stack to import values from

  ClickHouseStackName:
    Type: String
    Default: sutram-ch
    Description: Name of the ClickHouse stack to import values from

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Desired number of ECS tasks

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: CPU units for the ECS task (1 vCPU = 1024 units)

  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]
    Description: Memory in MB for the ECS task

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-ALB-SecurityGroup"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Public-Subnets"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-alb"
        - Key: Environment
          Value: !Ref Environment

  # Target Group
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-web-tg"
      Port: 8080
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${InfraStackName}-VPC-ID"
      HealthCheckPath: /health
      HealthCheckPort: 8080
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: ip
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-tg"
        - Key: Environment
          Value: !Ref Environment

  # ALB Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Task Definition
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-web"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskExecutionRole"
      TaskRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskRole"
      ContainerDefinitions:
        - Name: web
          Image: !Sub
            - "${ECRUri}:${ImageTag}"
            - ECRUri: !ImportValue
                Fn::Sub: "${InfraStackName}-Web-ECR-URI"
              ImageTag: !Ref ImageTag
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: APP_PORT
              Value: "8080"
            - Name: POSTGRES_HOST
              Value: !ImportValue
                Fn::Sub: "${PostgreSQLStackName}-PostgreSQL-DNS"
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: "sutram"
            - Name: POSTGRES_USER
              Value: "admin"
            - Name: POSTGRES_PASSWORD
              Value: "REDACTED_PASSWORD"
            - Name: CLICKHOUSE_HOST
              Value: !Sub "clickhouse.${ProjectName}-${Environment}.local"
            - Name: CLICKHOUSE_PORT
              Value: "8123"
            - Name: CLICKHOUSE_DB
              Value: "sutram"
            - Name: CLICKHOUSE_USER
              Value: "admin"
            - Name: CLICKHOUSE_PASSWORD
              Value: "REDACTED_PASSWORD"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "${InfraStackName}-Web-LogGroup"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - "CMD-SHELL"
              - "curl -f http://localhost:8080/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-task"
        - Key: Environment
          Value: !Ref Environment

  # ECS Service
  WebService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-web-service"
      Cluster: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-Cluster"
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Web-SecurityGroup"
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Private-Subnets"
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8080
          TargetGroupArn: !Ref WebTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      ServiceTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-web-service"
        - Key: Environment
          Value: !Ref Environment
      EnableExecuteCommand: !If [IsProduction, false, true]

  # Auto Scaling Target
  WebServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub "service/${ProjectName}-${Environment}-cluster/${ProjectName}-${Environment}-web-service"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Auto Scaling Policy - CPU
  WebServiceScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-web-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Auto Scaling Policy - Memory
  WebServiceScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-web-memory-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WebServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Route53 Record for Web Service
  WebDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "web.${ProjectName}-${Environment}.local"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

Outputs:
  LoadBalancerDNSName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancer-DNS"

  LoadBalancerHostedZoneId:
    Description: Application Load Balancer Hosted Zone ID
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancer-HostedZoneId"

  WebServiceDNSName:
    Description: Web Service DNS Name (Route53)
    Value: !Sub "web.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-Web-DNS"

  WebServiceURL:
    Description: Web Service URL
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-Web-URL"

  WebServiceName:
    Description: ECS Service Name
    Value: !Ref WebService
    Export:
      Name: !Sub "${AWS::StackName}-Web-Service-Name"

  WebTaskDefinitionArn:
    Description: Web Task Definition ARN
    Value: !Ref WebTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-Web-TaskDefinition"

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref WebTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroup-ARN"
