AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - PostgreSQL Database'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Default: sutram-infra
    Description: Name of the infrastructure stack to import values from

  DatabaseInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium, db.r5.large, db.r5.xlarge]
    Description: RDS instance class

  DisableMultiAZ:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Disable Multi-AZ for cost optimization in development

  MinimalStorage:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Use minimal storage sizes for cost optimization

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  MinimalStorage: !Equals [!Ref MinimalStorage, "true"]
  DisableMultiAZ: !Equals [!Ref DisableMultiAZ, "true"]

Resources:
  # RDS Subnet Group
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for PostgreSQL database
      SubnetIds: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Database-Subnets"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-pg-subnet-group"
        - Key: Environment
          Value: !Ref Environment

  # RDS PostgreSQL - Cost Optimized
  PostgreSQLDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: !If [IsProduction, Snapshot, Delete]
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-postgres"
      DBName: sutram
      Engine: postgres
      EngineVersion: '15.7'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !If [MinimalStorage, 10, 20]
      MaxAllocatedStorage: !If [MinimalStorage, 20, 100]
      StorageType: gp3
      StorageEncrypted: !If [IsProduction, true, false]
      KmsKeyId: !If 
        - IsProduction
        - !ImportValue
          Fn::Sub: "${InfraStackName}-KMS-Key"
        - !Ref AWS::NoValue
      MasterUsername: admin
      ManageMasterUserPassword: !If [IsProduction, true, false]
      MasterUserSecret: !If
        - IsProduction
        - KmsKeyId: !ImportValue
            Fn::Sub: "${InfraStackName}-KMS-Key"
        - !Ref AWS::NoValue
      MasterUserPassword: !If [IsProduction, !Ref AWS::NoValue, "postgres123"]
      VPCSecurityGroups:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Database-SecurityGroup"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      MultiAZ: !If [DisableMultiAZ, false, !If [IsProduction, true, false]]
      BackupRetentionPeriod: !If [IsProduction, 7, 0]
      PreferredBackupWindow: !If [IsProduction, "03:00-04:00", !Ref AWS::NoValue]
      PreferredMaintenanceWindow: "sun:04:00-sun:05:00"
      DeletionProtection: false
      EnablePerformanceInsights: false
      MonitoringInterval: 0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-postgres"
        - Key: Environment
          Value: !Ref Environment

  # Route53 Record for PostgreSQL
  PostgreSQLDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "postgres.${ProjectName}-${Environment}.local"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt PostgreSQLDB.Endpoint.Address

Outputs:
  PostgreSQLEndpoint:
    Description: PostgreSQL Database Endpoint
    Value: !GetAtt PostgreSQLDB.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQL-Endpoint"

  PostgreSQLPort:
    Description: PostgreSQL Database Port
    Value: !GetAtt PostgreSQLDB.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQL-Port"

  PostgreSQLDatabaseName:
    Description: PostgreSQL Database Name
    Value: !Ref PostgreSQLDB
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQL-DatabaseName"

  PostgreSQLDNSName:
    Description: PostgreSQL DNS Name (Route53)
    Value: !Sub "postgres.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQL-DNS"

  PostgreSQLConnectionString:
    Description: PostgreSQL Connection String
    Value: !Sub "postgres://admin:postgres123@${PostgreSQLDNSRecord}:5432/sutram"
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQL-ConnectionString"
