AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Trading Platform - Live Service (ECS)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment name
  
  ProjectName:
    Type: String
    Default: sutram
    Description: Project name for resource naming

  InfraStackName:
    Type: String
    Description: Name of the infrastructure stack to import values from

  PostgreSQLStackName:
    Type: String
    Description: Name of the PostgreSQL stack to import values from

  ClickHouseStackName:
    Type: String
    Default: sutram-ch
    Description: Name of the ClickHouse stack to import values from

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Desired number of ECS tasks

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: CPU units for the ECS task (1 vCPU = 1024 units)

  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]
    Description: Memory in MB for the ECS task

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  # Application Load Balancer for Live Service
  LiveLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-live-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${InfraStackName}-ALB-SecurityGroup"
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${InfraStackName}-Public-Subnets"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-alb"
        - Key: Environment
          Value: !Ref Environment

  # Target Group for Live Service
  LiveTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-live-tg"
      Port: 8081
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: "${InfraStackName}-VPC-ID"
      HealthCheckPath: /health
      HealthCheckPort: 8081
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: ip
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-tg"
        - Key: Environment
          Value: !Ref Environment

  # ALB Listener for Live Service
  LiveALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref LiveTargetGroup
      LoadBalancerArn: !Ref LiveLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Task Definition for Live Service
  LiveTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-live"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskExecutionRole"
      TaskRoleArn: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-TaskRole"
      ContainerDefinitions:
        - Name: live
          Image: !Sub
            - "${ECRUri}:${ImageTag}"
            - ECRUri: !ImportValue
                Fn::Sub: "${InfraStackName}-Live-ECR-URI"
              ImageTag: !Ref ImageTag
          Essential: true
          PortMappings:
            - ContainerPort: 8081
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: APP_PORT
              Value: "8081"
            - Name: POSTGRES_HOST
              Value: !ImportValue
                Fn::Sub: "${PostgreSQLStackName}-PostgreSQL-DNS"
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: "sutram"
            - Name: POSTGRES_USER
              Value: "admin"
            - Name: POSTGRES_PASSWORD
              Value: "postgres123"
            - Name: CLICKHOUSE_HOST
              Value: !Sub "clickhouse.${ProjectName}-${Environment}.local"
            - Name: CLICKHOUSE_PORT
              Value: "8123"
            - Name: CLICKHOUSE_DB
              Value: "sutram"
            - Name: CLICKHOUSE_USER
              Value: "admin"
            - Name: CLICKHOUSE_PASSWORD
              Value: "clickhouse123"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "${InfraStackName}-Live-LogGroup"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - "CMD-SHELL"
              - "curl -f http://localhost:8081/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-task"
        - Key: Environment
          Value: !Ref Environment

  # ECS Service for Live
  LiveService:
    Type: AWS::ECS::Service
    DependsOn: LiveALBListener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-live-service"
      Cluster: !ImportValue
        Fn::Sub: "${InfraStackName}-ECS-Cluster"
      TaskDefinition: !Ref LiveTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Web-SecurityGroup"
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: "${InfraStackName}-Private-Subnets"
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: live
          ContainerPort: 8081
          TargetGroupArn: !Ref LiveTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      ServiceTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-live-service"
        - Key: Environment
          Value: !Ref Environment
      EnableExecuteCommand: !If [IsProduction, false, true]

  # Auto Scaling Target for Live Service
  LiveServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub "service/${ProjectName}-${Environment}-cluster/${ProjectName}-${Environment}-live-service"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Auto Scaling Policy - CPU for Live Service
  LiveServiceScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-live-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref LiveServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Auto Scaling Policy - Memory for Live Service
  LiveServiceScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Environment}-live-memory-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref LiveServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Route53 Record for Live Service
  LiveDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: "${InfraStackName}-HostedZone-ID"
      Name: !Sub "live.${ProjectName}-${Environment}.local"
      Type: A
      AliasTarget:
        DNSName: !GetAtt LiveLoadBalancer.DNSName
        HostedZoneId: !GetAtt LiveLoadBalancer.CanonicalHostedZoneID

Outputs:
  LiveLoadBalancerDNSName:
    Description: Live Load Balancer DNS Name
    Value: !GetAtt LiveLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-Live-LoadBalancer-DNS"

  LiveLoadBalancerHostedZoneId:
    Description: Live Load Balancer Hosted Zone ID
    Value: !GetAtt LiveLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-Live-LoadBalancer-HostedZoneId"

  LiveServiceDNSName:
    Description: Live Service DNS Name (Route53)
    Value: !Sub "live.${ProjectName}-${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-Live-DNS"

  LiveServiceURL:
    Description: Live Service URL
    Value: !Sub "http://${LiveLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-Live-URL"

  LiveServiceName:
    Description: ECS Service Name
    Value: !Ref LiveService
    Export:
      Name: !Sub "${AWS::StackName}-Live-Service-Name"

  LiveTaskDefinitionArn:
    Description: Live Task Definition ARN
    Value: !Ref LiveTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-Live-TaskDefinition"

  LiveTargetGroupArn:
    Description: Live Target Group ARN
    Value: !Ref LiveTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-Live-TargetGroup-ARN"
